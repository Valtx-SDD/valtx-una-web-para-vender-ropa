name: "Valtx SDD Gates"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main, master ]

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [constitution, specify, plan, implement, merge]
    name: "gates · ${{ matrix.phase }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar Gates de Gobernanza
        uses: Valtx-SDD/valtx-sdd-core@v0.0.7
        with:
          phase: ${{ matrix.phase }}
          hub-url: ${{ vars.VALTX_HUB_URL }}
          hub-secret: ${{ secrets.VALTX_HUB_SECRET }}
